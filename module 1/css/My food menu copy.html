<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My food menu</title>
    <style>
           h1{
            color:Darkorange;
            text-align:center;
           }
           body{
            background-color:palegoldenrod;
            text-align:center;
            font-size:x-large;
           }
          h1+p{
            color:Darkorange;
            background-color:rgb(255, 225, 0);
            display:inline-block;
          }
          ul>li{
            list-style-type:none;
            background-color:orange;
            border-radius:10px;
             margin:10px auto;
             width:300px;
          }
          ul li:nth-child(5){
            background-color:gold;
            color:rgb(255, 131, 152);
          }
        ul+p::first-letter{
            color:red;
            font-size:xx-large;
          }
          .button{
            background-color:orange;
            color:white;
            border-radius:10px;
            padding:10px 20px;
            margin:10px;
            font-size:large;
          }
          button:hover{
            background-color:gold;
            color:rgb(250, 246, 2);
          }
    </style>
</head>
<body>
 <h1>My food menu</h1>
<p> Pick your favorite dish and dig in!!!!</p>  
<ul>
    <li>Ice cream</li>
    <li>Burger</li>
    <li>Fried chicken</li>
    <li>French fries</li>
    <li>Pizza-chef's special</li>
    <li>Chocolate cake</li>
    <li>Milkshake</li>
    <li>Salad</li>
    <li>Pasta</li>
    <li>Sushi</li>
</ul>
<p>I can't decide which one to choose!</p>
<button class="button">Order Now</button>
<button class="button">See Details!!!!</button>
</body>
</html>
