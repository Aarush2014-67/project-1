<!DOCTYPE html>

<html>

<head>

<title>My Animal Fact File</title>

<style>

/* Page background — sets the colour and font for the whole page */

body {

background-color: darkgreen;

font-family: Arial, sans-serif;

}

/* Box Model — width sets the content area

padding pushes the text away from the edges

border draws a visible frame around the fact file

margin pushes the fact file away from the screen edge */

.fact-file {

background-color: lightyellow;

color: darkslategray;

width: 260px;

padding: 25px;

border: 4px solid forestgreen;

margin: 30px;

}

/* Animal name — forestgreen so it stands out */

.animal-name {

color: forestgreen;

font-size: 22px;

}

/* Detail rows — dark text on the light background */

.detail {

color: darkslategray;

}

/* Cool fact — orange and italic to make it feel special */

.cool-fact {

color: darkorange;

font-style: italic;

}

#animal-name:hover {
    color: darkorange;
   background-color: darkgreen;
}

#animal-image {
    border-color:darkorange;
    border-width:5px;
}

</style>

</head>

<body>

<div class="fact-file">

<h2 id="animal-name">Tiger</h2>

<p class="detail"><b>Type: Big Cat</b></p>

<p class="detail">Lives in: <u>Forests and grasslands of Asia</u></p>

<p class="detail">Diet: <i>Deer, goats, and wild sheep</i></p>

<p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>

</div>

<img id="animal-image" src="C:\Users\Aarush\Downloads\dog-8198719_1280.jpg" alt="tiger" width="260" height="200">

</body>

</html>
