<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My super hero</title>
 <style>
    h1{
        color:yellow;
       text-shadow:5px 5px 5px orange;
       font-size:70px;
       text-align:center;
    }
    body{
        background-color:blue;
     }
     h3{
        color:lightblue;
        text-align:center;
        text-transform:capitalize;
        font-style:italic;
     }
       .properties{
        color:red;
        text-decoration:underline;
        text-transform:uppercase;
        font-size:30px;
       }
       
       #pow{
        color:lightgreen;
         font-size:20px;
       }
           #weak{
        color:grey;
         font-size:20px;
         text-decoration:line-through;
       }
       #main{
        color:yellow;
        font-size:25px;
        transform:rotate(15deg);
       }

    </style>
</head>
<body>
    <h1>Thunder kid</h1>
    <h3>the most powerful hero in school</h3>
    <p class="properties">superpowers</p><br>
    <ul id="pow">
        <li>Lightning control</li>
        <li>Super speed</li>
        <li>Enhanced strength</li>
        <li>magic</li>
    </ul>
    <p class="properties">weaknesses</p><br>
    <ul id="weak">
        <li>giants</li>
        <li> black Magic</li>
        <li>globins</li>
        </ul><br><br><br>
        <p id="main">Thunder kid never had a weakness</p>
</body>
</html>
