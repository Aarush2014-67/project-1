<!DOCTYPE html>
<html lang="en">               
 <head>
    <title>Water Page</title>
    <style>
        #head {
           color: white;
            font-size:70px;
        }
        #subtitle {
            color:white;
            font-size:40px;
            text-align: center;
        }
        .weather-card {
            width: 400px;
            border: 4px solid white;
            border-radius: 20%;
            text-align: center;
        }
        body {
            background-color:rgba(9, 120, 231, 0.904);
        }
        .forecast {
            font-size: 30px;
        }
    </style>
 </head>       
 <body>
    <h1 id = "head">  <center><sup>D</sup>aily <sup>K</sup>ids <sup>F</sup>orcast</h1></center>
    <h2 id = "subtitle">Weekly Forecast</h2>
    <div class = "weather-card">
    <p class = "forecast">Today's temperature</p>
    <p id="icon">partly cloudy</p>
    <h5 id = "temperature">35°C</h5>
    <p class = "details">City: Chennai</p>
    <p class = "details">Condition: Partly Cloudy</p>
    <p class = "details">Humidity: 55%</p>
    <p class = "details">Wind Speed: 12 km/h</p>
    </div>
    <div class="days of the week">
    <p class = "day">Monday: Sunny - 30°C</p>
    <p class = "day">Tuesday: Cloudy - 27°C</p>
    <p class = "day">Wednesday: Rainy - 24°C</p>    
    <p class = "day">Thursday: Windy - 26°C</p>
    <p class = "day">Friday: Stormy - 23°C</p>
    </div>
 </body>
</html>
